<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>BNI LINKED // MAP TACTIQUE</title>
    <link rel="manifest" href="../manifest.json">
    <meta name="theme-color" content="#000000">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Rajdhani:wght@400;500;600;700;800&family=VT323&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="style.css">
    <script>
        if ('serviceWorker' in navigator) {
            window.addEventListener('load', () => {
                navigator.serviceWorker.register('../sw.js').catch(err => console.warn('[SW] Register failed:', err));
            });
        }
    </script>
<body class="labels-auto map-shell">

    <div id="modal-overlay" class="hidden" role="dialog" aria-modal="true" aria-labelledby="modal-title" tabindex="-1">
        <div id="modal-box">
            <div id="modal-title">TITRE</div>
            <div id="modal-content">Message...</div>
            
            <div id="modal-input-container" style="display:none;">
                <input type="text" id="modal-input" class="gps-input full-width" autocomplete="off">
            </div>
            
            <div id="modal-color-picker" style="display:none; padding: 0 20px 20px 20px;">
                <div id="color-swatches" class="color-grid"></div>
                <div class="separator-h" style="margin: 10px 0;"></div>
                <label style="font-size:0.8rem; color:#8892b0;">Ou personnalisé :</label>
                <div style="display:flex; align-items:center; gap:10px; margin-top:5px;">
                    <input type="color" id="modal-color-input" value="#ffffff" style="width:50px; height:30px; border:1px solid #333; background:none; padding:0;">
                    <span id="modal-color-hex" style="font-family:monospace; color:var(--text-main);">#FFFFFF</span>
                </div>
            </div>

            <div id="modal-actions"></div>
        </div>
    </div>

    <div id="context-menu" class="context-menu">
        <button id="ctx-new-point">Nouveau point</button>
        <button id="ctx-new-zone">Nouvelle zone</button>
        <button id="ctx-new-free-zone">Dessin libre</button>
        <div class="separator-h"></div>
        <button id="ctx-cancel">Fermer</button>
    </div>

    <div id="top-bar">
        <div class="logo-area">
            <button id="btnMobileMenu" class="mobile-only">☰</button>
            <span class="app-logo">💠</span>
            <span class="app-title">LINKED <span style="color:var(--accent-pink)">// MAP</span></span>
        </div>
    </div>

    <div id="app-container">
        
        <div id="sidebar-left">
            <div class="panel-section shell-section shell-section-brand">
                <img src="logo-bni-linked.png" alt="BNI LINKED" class="shell-logo">
                
                <button class="btn-switch shell-mode-btn" onclick="window.location.href='../point/index.html';">
                    Basculer vers mode réseau
                </button>
            </div>

            <div class="panel-section shell-section">
                <span class="section-title shell-title">Données tactiques</span>
                <input type="file" id="fileImport" accept=".json" style="display:none">
                <input type="file" id="fileMerge" accept=".json" style="display:none">

                <button id="btnDataFileToggle" class="action-btn shell-primary-btn" type="button" aria-expanded="false">Fichier</button>

                <div class="data-shell-status">
                    <div class="data-shell-card">
                        <span class="data-shell-label">Statut</span>
                        <strong id="cloudStatus" data-state="local">Local</strong>
                    </div>
                    <div class="data-shell-card">
                        <span class="data-shell-label">Board</span>
                        <strong id="cloudStatusMeta" data-state="local">Hors ligne</strong>
                    </div>
                </div>

                <div id="dataActionLaunchers" hidden>
                    <button id="btnSave" type="button">Sauvegarder</button>
                    <button id="btnTriggerImport" type="button">Ouvrir</button>
                    <button id="btnTriggerMerge" type="button">Fusionner</button>
                    <button id="btnResetMap" type="button">Reset</button>
                    <button id="btnCloudMenu" type="button">Cloud</button>
                </div>
            </div>

            <div class="panel-section shell-section">
                <span class="section-title shell-title">Outils</span>
                <button id="btnToggleGpsPanel" class="action-btn full-width shell-secondary-btn">Saisie coordonnées</button>
            </div>

            <div class="panel-header panel-header-groups">
                <div class="panel-header-row">
                    <span>CALQUES OPÉRATIONNELS</span>
                    <button id="btnAddGroup" class="mini-btn mini-btn-plus" title="Nouveau Groupe">＋</button>
                </div>
                <div class="compact-search">
                    <span class="compact-search-icon">⌕</span>
                    <input type="text" id="searchInput" placeholder="Filtrer cibles..." autocomplete="off">
                </div>
            </div>
            <div id="groups-list" class="scrollable-content"></div>
        </div>

        <div id="sidebar-overlay"></div>

        <div id="viewport">
            <div id="map-world">
                <img id="map-image" src="carte.jpg" alt="Carte Tactique">
                <svg style="position:absolute; width:0; height:0; overflow:hidden;">
                    <defs>
                        <marker id="arrowhead" markerWidth="10" markerHeight="7" refX="9" refY="3.5" orient="auto">
                            <polygon points="0 0, 10 3.5, 0 7" fill="#ffffff" />
                        </marker>
                    </defs>
                </svg>
                <svg id="zones-layer"></svg>
                <svg id="alert-layer"></svg>
                <svg id="links-layer" style="position:absolute; top:0; left:0; width:100%; height:100%; pointer-events:none;"></svg>
            </div>
            <div id="markers-layer"></div>
            <div id="map-alert-banner" hidden></div>
            <div id="alert-picker-overlay" hidden>
                <div class="alert-picker-card">
                    <span class="alert-picker-kicker">Selection alerte</span>
                    <strong>Clique sur la carte pour envoyer la position.</strong>
                </div>
            </div>
            
            <div id="hud-bottom">
                <div id="coords-display" class="desktop-only">00.00 | 00.00</div>
                <div class="separator desktop-only"></div>
                <div id="zoom-display" class="zoom-display" aria-live="polite">
                    <span class="zoom-display-label">Zoom</span>
                    <strong id="zoom-display-value">100%</strong>
                    <span class="zoom-display-bar"><span id="zoom-display-fill"></span></span>
                </div>
                <button id="btnZoomOut" class="hud-btn" title="Zoom arrière">－</button>
                <button id="btnZoomIn" class="hud-btn" title="Zoom avant">＋</button>
                <button id="btnToggleLight" class="hud-btn" title="Mode Lumière / Hologramme">💡</button>
                <button id="btnResetView" class="hud-btn" title="Recentrer">🎯</button>
                <button id="btnToggleLabels" class="hud-btn" style="min-width:100px;">
                    NOMS: AUTO
                </button>
            </div>

            <div id="gps-panel" class="floating-panel" style="display:none;">
                <div class="panel-header panel-header-floating">
                    <span>POINT GPS</span>
                    <button class="mini-btn close-gps">×</button>
                </div>
                <div class="gps-panel-body">
                    <div class="gps-row">
                        <div class="gps-field-block gps-field-inline">
                            <label class="gps-label" for="gpsInputX">COORDONNEE X</label>
                            <input type="text" id="gpsInputX" placeholder="X" class="gps-input" autocomplete="off">
                        </div>
                        <div class="gps-field-block gps-field-inline">
                            <label class="gps-label" for="gpsInputY">COORDONNEE Y</label>
                            <input type="text" id="gpsInputY" placeholder="Y" class="gps-input" autocomplete="off">
                        </div>
                    </div>
                    <div class="gps-field-block">
                        <label class="gps-label" for="gpsGroupSelect">CALQUE CIBLE</label>
                        <select id="gpsGroupSelect" class="gps-input"></select>
                    </div>
                    <div class="gps-field-block">
                        <label class="gps-label" for="gpsName">NOM DU POINT</label>
                        <input type="text" id="gpsName" placeholder="Nom du point" autocomplete="off">
                    </div>
                    <div class="gps-row">
                        <div class="gps-field-block gps-field-inline">
                            <label class="gps-label" for="gpsIconType">ICONE</label>
                            <select id="gpsIconType"></select>
                        </div>
                        <div class="gps-field-block gps-field-inline">
                            <label class="gps-label" for="gpsAffiliation">TYPE</label>
                            <input type="text" id="gpsAffiliation" placeholder="Type" autocomplete="off">
                        </div>
                    </div>
                    <div class="gps-field-block">
                        <label class="gps-label" for="gpsNotes">NOTES</label>
                        <textarea id="gpsNotes" placeholder="Notes..."></textarea>
                    </div>
                    <button id="btnAddGpsPoint" class="action-btn full-width gps-submit">
                        Placer
                    </button>
                </div>
            </div>

            <div id="drawing-toolbar" class="floating-panel compact" style="display:none;">
                <div class="toolbar-header">
                    <span>ÉDITION ZONE</span>
                </div>
                <div class="toolbar-content">
                    <div class="tool-row">
                        <label>ÉPAISSEUR</label>
                        <input type="range" id="drawWidth" min="1" max="10" value="2" step="1">
                        <span id="drawWidthVal" class="draw-width-value">2px</span>
                    </div>
                    <div class="tool-row">
                        <label>STYLE</label>
                        <select id="drawStyle" class="mini-select">
                            <option value="solid">Trait Plein</option>
                            <option value="dashed">Tirets</option>
                            <option value="dotted">Pointillés</option>
                        </select>
                    </div>
                    
                    <div class="tool-actions">
                        <button id="btnDrawSmooth" class="action-btn" title="Lisser la forme" style="flex:1;">Lisser</button>
                        <div class="separator"></div>
                        <button id="btnDrawCancel" class="action-btn btn-red" title="Annuler">Annuler</button>
                        <button id="btnDrawConfirm" class="action-btn btn-green" title="Valider">Valider</button>
                    </div>
                </div>
            </div>

        </div>

        <div id="sidebar-right">
            <div class="panel-header panel-header-editor">DOSSIER TACTIQUE</div>
            <div id="editor-content">
                <div class="empty-state">
                    <span class="empty-state-kicker">Aucune cible</span>
                    <strong>Sélectionnez un point ou une zone.</strong>
                </div>
            </div>
        </div>
    </div>

    <script type="module" src="./js/main.js"></script>
    <script type="module">
        import { state } from './js/state.js';
        window.state = state;
    </script>
    <script>
        const btnLight = document.getElementById('btnToggleLight');
        if (btnLight) {
            btnLight.addEventListener('click', () => {
                document.body.classList.toggle('high-light-mode');
                btnLight.classList.toggle('active', document.body.classList.contains('high-light-mode'));
            });
        }

    <script>
        (() => {
            const selector = 'input:not([type="checkbox"]):not([type="radio"]):not([type="range"]):not([type="color"]):not([type="hidden"]), textarea';
            const lockField = (field) => {
                if (!field || typeof field.setAttribute !== 'function') return;
                field.setAttribute('autocomplete', 'off');
                field.setAttribute('autocorrect', 'off');
                field.setAttribute('autocapitalize', 'off');
                field.setAttribute('spellcheck', 'false');
            };
            document.querySelectorAll(selector).forEach(lockField);
            document.addEventListener('focusin', (event) => {
                const field = event.target;
                if (field && typeof field.matches === 'function' && field.matches(selector)) lockField(field);
            });
        })();
    </script>
</body>
</html>
